<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Recorder</title>
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --fg: #1f2328; --muted: #6b7280; --border: #d0d7de;
    --accent: #e5484d; --ok: #30a46c; --chip: #eef0f3;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --card: #1e2126; --fg: #e6e8eb; --muted: #9aa1ab; --border: #3a3f47; --chip: #2a2e35; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px 20px; text-align: center;
  }
  .lang { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .say { font-size: clamp(40px, 9vw, 72px); font-weight: 600; margin: 10px 0 2px; overflow-wrap: anywhere; }
  .hint { color: var(--muted); min-height: 1.4em; }
  .meter { height: 8px; border-radius: 4px; background: var(--chip); margin: 22px auto 8px; max-width: 360px; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--ok); transition: width .08s; }
  .rec { display: inline-flex; align-items: center; gap: 10px; margin-top: 10px; padding: 12px 22px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--fg);
    font: inherit; font-weight: 600; cursor: pointer; user-select: none; touch-action: none; }
  .rec .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); opacity: .5; }
  .recording .rec { background: var(--accent); color: #fff; border-color: var(--accent); }
  .recording .rec .dot { background: #fff; opacity: 1; }
  .status { min-height: 1.4em; margin-top: 12px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--accent); }
  .nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
  .nav button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--fg); cursor: pointer; }
  .keys { color: var(--muted); font-size: 13px; margin-top: 14px; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; background: var(--card); }
  h2 { font-size: 14px; margin: 28px 0 8px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid transparent; background: var(--chip); color: var(--fg); border-radius: 999px;
    padding: 3px 10px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip.done { box-shadow: inset 0 -2px 0 var(--ok); }
  .chip.done::before { content: "✓ "; color: var(--ok); }
  .chip.current { border-color: var(--accent); }
  .progress { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Clip recorder</h1>
  <p class="sub">Say each word naturally, as you would answer a review. Clips are saved into this
    repository on your computer only.</p>

  <section class="card" id="card">
    <div class="lang" id="lang"></div>
    <div class="say" id="say" lang="ja"></div>
    <div class="hint" id="hint"></div>
    <div class="meter"><div id="meter"></div></div>
    <button class="rec" id="rec" type="button"><span class="dot"></span><span id="rec-label">Hold to record</span></button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="nav">
      <button type="button" id="prev">← Previous</button>
      <button type="button" id="play" disabled>▶ Play</button>
      <button type="button" id="next">Next →</button>
    </div>
    <div class="keys">Hold <kbd>Space</kbd> to record · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>P</kbd> play back</div>
  </section>

  <p class="progress" id="progress"></p>
  <h2>English</h2><div class="chips" id="chips-en"></div>
  <h2>Japanese</h2><div class="chips" id="chips-ja" lang="ja"></div>
  <h2>Noise checks</h2><div class="chips" id="chips-noise"></div>
</main>
<script src="/src/content/audio.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const { words, recorded, set } = await (await fetch('/status')).json();
  document.querySelector('.sub').append(` Saving to test/fixtures/audio/${set}/.`);
  const items = ['en', 'ja', 'noise'].flatMap(lang => words[lang].map(w => ({ ...w, lang })));
  const done = new Set(recorded);
  const LANG_NAMES = { en: 'English meaning', ja: 'Japanese reading', noise: 'Noise check' };
  let index = Math.max(0, items.findIndex(w => !done.has(`${w.lang}/${w.slug}`)));
  let lastUrl = null;
  let busy = false;

  const mic = WKV.audio.createMic({
    onLevel: level => { $('meter').style.width = `${Math.min(100, Math.sqrt(level) * 400)}%`; },
  });

  function setStatus(text, kind = '') {
    $('status').textContent = text;
    $('status').className = `status ${kind}`;
  }

  function render() {
    const w = items[index];
    $('lang').textContent = `${LANG_NAMES[w.lang]} · ${index + 1} / ${items.length}`;
    $('say').textContent = w.say;
    $('say').style.fontSize = w.lang === 'noise' ? '28px' : '';
    $('hint').textContent = w.hint ?? '';
    $('play').disabled = !done.has(`${w.lang}/${w.slug}`);
    for (const lang of ['en', 'ja', 'noise']) {
      $(`chips-${lang}`).replaceChildren(...items.map((it, i) => {
        if (it.lang !== lang) return null;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = `chip${done.has(`${it.lang}/${it.slug}`) ? ' done' : ''}${i === index ? ' current' : ''}`;
        b.textContent = it.lang === 'noise' ? it.slug : it.say;
        b.onclick = () => { index = i; lastUrl = null; setStatus(''); render(); };
        return b;
      }).filter(Boolean));
    }
    $('progress').textContent = `${done.size} of ${items.length} recorded`;
  }

  function wav(samples, rate) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, samples.length * 2, true);
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return new Blob([buf], { type: 'audio/wav' });
  }

  async function startRec() {
    if (busy || mic.isRecording()) return;
    try {
      await mic.start();
    } catch (e) {
      setStatus(`Microphone unavailable: ${e.message}`, 'err');
      return;
    }
    document.body.classList.add('recording');
    $('rec-label').textContent = 'Recording… release to save';
    setStatus('');
  }

  async function stopRec() {
    if (!mic.isRecording()) return;
    // Keep a little trailing audio, as a real push-to-talk release would.
    busy = true;
    await new Promise(r => setTimeout(r, 250));
    const clip = mic.stop();
    document.body.classList.remove('recording');
    $('rec-label').textContent = 'Hold to record';
    const w = items[index];
    const seconds = clip.audio.length / WKV.audio.TARGET_RATE;
    if (seconds < 0.3) {
      busy = false;
      setStatus('Too short: hold while you speak.', 'err');
      return;
    }
    const blob = wav(clip.audio, WKV.audio.TARGET_RATE);
    const res = await fetch(`/save/${w.lang}/${w.slug}`, { method: 'POST', body: blob });
    busy = false;
    if (!res.ok) { setStatus(`Save failed: ${(await res.json()).error}`, 'err'); return; }
    done.add(`${w.lang}/${w.slug}`);
    lastUrl = URL.createObjectURL(blob);
    const quiet = !clip.heardSpeech && w.lang !== 'noise' ? ' (sounded very quiet; maybe re-record)' : '';
    setStatus(`Saved ${seconds.toFixed(1)} s${quiet}. Press → for the next word.`, quiet ? 'err' : 'ok');
    render();
  }

  function play() {
    const w = items[index];
    const url = lastUrl ?? `/test/fixtures/audio/${set}/${w.lang}/${w.slug}.wav?${Date.now()}`;
    new Audio(url).play();
  }

  function move(d) {
    index = (index + d + items.length) % items.length;
    lastUrl = null;
    setStatus('');
    render();
  }

  $('rec').addEventListener('pointerdown', startRec);
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) $('rec').addEventListener(ev, stopRec);
  $('prev').onclick = () => move(-1);
  $('next').onclick = () => move(1);
  $('play').onclick = play;
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) startRec(); }
    else if (e.key === 'ArrowRight') move(1);
    else if (e.key === 'ArrowLeft') move(-1);
    else if (e.key === 'p' || e.key === 'P') play();
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') { e.preventDefault(); stopRec(); } });

  render();
  try {
    await mic.open(); // ask for the microphone up front
    setStatus('Microphone ready. Hold Space (or the button) while you speak.');
  } catch (e) {
    setStatus(`Microphone unavailable: ${e.message}`, 'err');
  }
})();
</script>
</body>
</html>
