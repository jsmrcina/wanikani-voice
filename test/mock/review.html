<!doctype html>
<!--
  Hand-built stand-in for https://www.wanikani.com/subjects/review, served at
  /subjects/review/ by test/run_tests.py. It mimics only what the extension
  touches, plus a question-characters element the extension must ignore.
  Markup and behaviour follow the live page as observed 2026-10-04:
  - graded: correct="true"/"false" on .quiz-input__input-container, input gets
    enabled="false"; both reset when the next question loads
  - didAnswerQuestion fires on grading AND again on advancing, immediately
    followed by willShowNextQuestion
  - a wrong-type answer un-hides .quiz-input__exception-container
  - WaniKani's Stimulus controllers, reduced to what src/page/ignore-answer.js
    uses (read from WaniKani's quiz_input / quiz_queue controllers
    2026-10-20): quiz-input grades and calls quiz-queue's submitAnswer at
    once, which counts a wrong answer and moves the item back in the queue;
    the next submit calls nextItem. #mock-stats shows the queue's state.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mock WaniKani Review</title>
  <style>
    body { font: 16px system-ui; margin: 0; }
    header { height: 56px; background: #333; color: #fff; display: flex; align-items: center; padding: 0 16px; }
    .character-header { background: #a0f; color: #fff; text-align: center; font-size: 72px; padding: 24px; }
    .quiz-input__question-type-container { text-align: center; padding: 8px; background: #eee; }
    .quiz-input__question-type-container[data-question-type="reading"] { background: #333; color: #fff; }
    .quiz-input__input-container form { display: flex; margin: 0; }
    .quiz-input__input-container[correct="true"] input { background: #8c8; }
    .quiz-input__input-container[correct="false"] input { background: #f66; }
    #user-response { flex: 1; font-size: 24px; text-align: center; padding: 8px; }
  </style>
</head>
<body>
  <header>Mock review</header>
  <div class="character-header"><div class="character-header__characters"></div></div>
  <div data-controller="quiz-queue quiz-statistics"><span class="percent">100%</span></div>
  <div class="quiz-input" data-controller="quiz-input">
    <label for="user-response" class="quiz-input__question-type-container">
      <span class="quiz-input__question-category"></span>
      <span class="quiz-input__question-type"></span>
    </label>
    <div class="quiz-input__input-wrapper">
      <div class="quiz-input__input-container">
        <form autocomplete="off" onsubmit="return false">
          <input class="quiz-input__input" id="user-response" type="text" autocomplete="off" autocapitalize="none">
          <button class="quiz-input__submit-button" type="button">&rarr;</button>
        </form>
      </div>
      <div class="quiz-input__exception-container" hidden>
        <div class="quiz-input__exception"></div>
      </div>
    </div>
  </div>
  <pre id="mock-log">[]</pre>
  <pre id="mock-stats">{}</pre>
  <script>
    const QUEUE = [
      { chars: '火', category: 'Radical', type: 'Name', answer: 'fire' },
      { chars: '人', category: 'Kanji', type: 'Reading', answer: 'じん' },
      { chars: '四', category: 'Kanji', type: 'Meaning', answer: 'four' },
      { chars: '二十', category: 'Vocabulary', type: 'Meaning', answer: '20' },
      { chars: '大人', category: 'Vocabulary', type: 'Reading', answer: 'おとな' },
      { chars: '口', category: 'Kanji', type: 'Meaning', answer: 'mouth' },
    ];
    const log = [];
    let index = 0;
    let graded = false;
    const $ = s => document.querySelector(s);
    const input = $('#user-response');
    const container = $('.quiz-input__input-container');

    function record(entry) {
      log.push(entry);
      $('#mock-log').textContent = JSON.stringify(log);
    }

    function show() {
      const q = QUEUE[index % QUEUE.length];
      $('.character-header__characters').textContent = q.chars;
      $('.quiz-input__question-category').textContent = q.category;
      $('.quiz-input__question-type').textContent = q.type.toLowerCase();
      $('.quiz-input__question-type-container').dataset.questionType =
        q.type === 'Reading' ? 'reading' : 'meaning';
      input.lang = q.type === 'Reading' ? 'ja' : 'en';
      input.value = '';
      input.setAttribute('enabled', 'true');
      $('.quiz-input__exception-container').hidden = true;
      container.removeAttribute('correct');
      graded = false;
      input.focus();
    }

    // ---- WaniKani's controllers, reduced ----
    const stats = new Map(); // item index -> { meaning, reading }
    const quizQueue = {
      stats: {
        get: item => stats.get(item.id) ?? { meaning: { incorrect: 0, complete: false }, reading: { incorrect: 0, complete: false } },
        set: (item, stat) => stats.set(item.id, stat),
      },
      activeQueue: QUEUE.map((_, i) => i),
      currentItem: null,
      questionType: null,
    };
    const statistics = { answeredCount: 0, incorrectCount: 0, percentCorrectTarget: $('.percent') };
    function showStats() {
      $('#mock-stats').textContent = JSON.stringify({ stats: Object.fromEntries(stats), activeQueue: quizQueue.activeQueue,
        answered: statistics.answeredCount, incorrect: statistics.incorrectCount, unanswered });
    }
    const queueController = {
      quizQueue,
      submitAnswer(answer, results) {
        const pass = results.action === 'pass';
        const stat = quizQueue.stats.get(quizQueue.currentItem);
        const type = quizQueue.questionType;
        stat[type].complete = pass;
        if (!pass) stat[type].incorrect += 1;
        quizQueue.stats.set(quizQueue.currentItem, stat);
        if (!pass) quizQueue.activeQueue = [...quizQueue.activeQueue.filter(i => i !== quizQueue.currentItem.id), quizQueue.currentItem.id];
        statistics.answeredCount += 1;
        if (!pass) statistics.incorrectCount += 1;
        showStats();
        window.dispatchEvent(new CustomEvent('didAnswerQuestion',
          { detail: { subject: QUEUE[quizQueue.currentItem.id], results } }));
      },
      nextItem() {
        const q = QUEUE[index % QUEUE.length];
        window.dispatchEvent(new CustomEvent('didAnswerQuestion', { detail: { subject: q } }));
        window.dispatchEvent(new CustomEvent('willShowNextQuestion', { detail: { subject: q } }));
        index += 1;
        setTimeout(show, 50);
      },
    };
    const inputController = {
      inputTarget: input,
      inputContainerTarget: container,
      inputChars: '',
      get currentQuestionType() { return QUEUE[index % QUEUE.length].type === 'Reading' ? 'reading' : 'meaning'; },
      set inputEnabled(on) { input.setAttribute('enabled', String(on)); },
      get inputEnabled() { return input.getAttribute('enabled') === 'true'; },
      clearException() { $('.quiz-input__exception-container').hidden = true; },
      bindWanakana() {},
    };
    queueController.element = document.querySelector('[data-controller~="quiz-queue"]');
    const controllers = { 'quiz-queue': queueController, 'quiz-statistics': statistics, 'quiz-input': inputController };
    window.Stimulus = { getControllerForElementAndIdentifier: (el, name) => (el ? controllers[name] : undefined) };
    let unanswered = 0;
    window.addEventListener('didUnanswerQuestion', () => { graded = false; unanswered += 1; showStats(); });

    function submit() {
      const q = QUEUE[index % QUEUE.length];
      if (graded) {
        queueController.nextItem();
        return;
      }
      const value = input.value.trim();
      const kana = /[぀-ヿ]/.test(value);
      if (!value || (q.type !== 'Reading' && kana)) {
        $('.quiz-input__exception-container').hidden = false;
        record({ index, shake: value });
        return;
      }
      graded = true;
      const pass = value === q.answer;
      $('.quiz-input__exception-container').hidden = true;
      input.setAttribute('enabled', 'false');
      container.setAttribute('correct', String(pass));
      record({ index, answer: value, pass });
      quizQueue.currentItem = { id: index % QUEUE.length };
      quizQueue.questionType = q.type === 'Reading' ? 'reading' : 'meaning';
      queueController.submitAnswer(value, { action: pass ? 'pass' : 'fail' });
    }

    $('.quiz-input__submit-button').addEventListener('click', submit);
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
    show();
  </script>
</body>
</html>
